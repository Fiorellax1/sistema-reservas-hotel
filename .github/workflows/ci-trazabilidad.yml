name: CI 4 - Estructura y trazabilidad

on:
  push:
    branches: [main, develop, 'feature/**']

  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  estructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estructura
        run: bash scripts/verificar-estructura.sh
  trazabilidad:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar referencia a issue
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_CUERPO: ${{ github.event.pull_request.body }}
        run: bash scripts/verificar-pr.sh
